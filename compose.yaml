# Compose file for running Paranoia locally.
#
# Purpose: run the server on port 8000 (podman-compose / docker compose).
# Scope:   server only; the web client is not containerized yet.
# Limits:  state is in memory, so restarting the container clears all rooms.

services:
  server:
    build:
      context: ./server
      dockerfile: Containerfile
    image: paranoia-server:latest
    ports:
      - "8000:8000"
    environment:
      PARANOIA_HISTORY_SIZE: "100"
      PARANOIA_MAX_TEXT: "500"
      PARANOIA_DEFAULT_ROOM: lobby
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # A static web service for client/web (e.g. nginx serving its build
  # output) would be added here later.
