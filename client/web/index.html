<!doctype html>
<!--
  HTML entry point for the Paranoia web client (Vite SPA).
  Scope: mounts the Svelte app into #app; sets the theme early.
  Limitations: the inline theme script duplicates src/lib/theme.js.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paranoia</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the scheme before first paint (no flash). Same key, hours
      // and rule as src/lib/theme.js: saved choice, else dark 18:00-06:00.
      var dark
      try {
        var c = localStorage.getItem('paranoia-theme')
        if (c === 'dark' || c === 'light') dark = c === 'dark'
      } catch (e) {}
      if (dark === undefined) {
        var h = new Date().getHours()
        dark = h >= 18 || h < 6
      }
      document.documentElement.setAttribute(
        'data-bs-theme', dark ? 'dark' : 'light')
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
